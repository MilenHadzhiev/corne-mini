# Left half (central): talks to the computer and to the right half
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Radio stability: 1M PHY is more robust than 2M, and max TX power
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Display, on its own work queue so redraws don't delay Bluetooth/key processing
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
